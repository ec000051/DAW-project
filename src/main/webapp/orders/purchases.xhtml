<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{authBean.requireUser}" />
    </f:metadata>

    <ui:define name="title">My Purchases</ui:define>

    <ui:define name="content">

        <div class="flex items-center gap-3 mb-8">
            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>
        </div>

        <section class="mb-8">
            <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">Orders</p>
            <h1 class="text-4xl font-extrabold text-slate-900 mb-3">My Purchases</h1>
            <p class="text-slate-600">Products you have bought or requested to buy.</p>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">

            <div class="px-6 py-5 border-b border-slate-200 flex items-center justify-between">
                <div>
                    <h2 class="text-xl font-bold text-slate-900">Purchase Requests</h2>
                    <p class="text-sm text-slate-500">Track your current and past purchase requests.</p>
                </div>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead class="bg-slate-100 text-slate-700 text-sm uppercase tracking-wide">
                    <tr>
                        <th><span class="block px-6 py-4">Order ID</span></th>
                        <th><span class="block px-6 py-4">Product</span></th>
                        <th><span class="block px-6 py-4">Price</span></th>
                        <th><span class="block px-6 py-4">Seller</span></th>
                        <th><span class="block px-6 py-4">Status</span></th>
                    </tr>
                    </thead>

                    <tbody id="purchasesTableBody">
                    <tr>
                        <td colspan="5" class="px-6 py-8 text-center text-slate-500">
                            Loading purchases...
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>

        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";
            const purchasesTableBody = document.getElementById("purchasesTableBody");

            function escapeHtml(value) {
                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function getStatusClass(status) {
                if (status === "APPROVED") {
                    return "bg-green-100 text-green-700";
                }

                if (status === "REJECTED") {
                    return "bg-red-100 text-red-700";
                }

                if (status === "PENDING") {
                    return "bg-yellow-100 text-yellow-800";
                }

                return "bg-slate-100 text-slate-700";
            }

            async function loadPurchases() {
                try {
                    const response = await fetch(contextPath + "/api/orders/purchases");

                    if (!response.ok) {
                        throw new Error("Could not load purchases");
                    }

                    const purchases = await response.json();

                    if (purchases.length === 0) {
                        purchasesTableBody.innerHTML =
                            '<tr>' +
                            '<td colspan="5" class="px-6 py-8 text-center text-slate-500">' +
                            'You have no purchase requests yet.' +
                            '</td>' +
                            '</tr>';
                        return;
                    }

                    purchasesTableBody.innerHTML = purchases.map(function (order) {
                        const product = order.product || {};
                        const seller = order.seller || {};

                        return '<tr class="border-b border-slate-100 hover:bg-slate-50 transition">' +

                            '<td>' +
                            '<span class="block px-6 py-4 text-slate-700 font-medium">#' +
                            escapeHtml(order.id) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<div class="px-6 py-4">' +
                            '<p class="font-bold text-slate-900">' +
                            escapeHtml(product.name) +
                            '</p>' +
                            '<p class="text-sm text-slate-500">Marketplace item</p>' +
                            '</div>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block px-6 py-4 font-bold text-slate-900">€' +
                            escapeHtml(product.price) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block px-6 py-4 text-slate-700">' +
                            escapeHtml(seller.username) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="inline-block mx-6 my-4 px-3 py-1 rounded-full text-sm font-semibold ' +
                            getStatusClass(order.status) +
                            '">' +
                            escapeHtml(order.status) +
                            '</span>' +
                            '</td>' +

                            '</tr>';
                    }).join("");

                } catch (error) {
                    console.error(error);

                    purchasesTableBody.innerHTML =
                        '<tr>' +
                        '<td colspan="5" class="px-6 py-8 text-center text-red-500">' +
                        'Error loading purchases.' +
                        '</td>' +
                        '</tr>';
                }
            }

            loadPurchases();

            //]]>
        </script>

    </ui:define>

</ui:composition>
