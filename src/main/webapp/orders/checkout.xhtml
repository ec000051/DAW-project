<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{authBean.requireUser}" />
    </f:metadata>

    <ui:define name="title">Confirm Order</ui:define>


    <ui:define name="content">
        <div class="flex items-center gap-3 mb-8">

            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>

        </div>

        <section class="max-w-3xl mx-auto">
            <div class="mb-8">
                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">Confirm Order</h1>
                <p class="text-slate-600">Review the product before sending your purchase request.</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-8">
                <div class="border-b border-slate-200 pb-6 mb-6">
                    <h2 class="text-2xl font-bold text-slate-900 mb-2">#{orderBean.selectedProduct.name}</h2>
                    <p class="text-slate-600 mb-2">#{orderBean.selectedProduct.description}</p>
                    <p class="text-2xl font-extrabold text-slate-900">€€#{orderBean.selectedProduct.price}</p>
                </div>

                <h:form>
                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Order note to seller
                        </label>

                        <h:inputTextarea value="#{orderBean.contactMessage}"
                                         styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 min-h-32 focus:outline-none focus:ring-2 focus:ring-slate-900"
                                         pt:placeholder="Example: Hello, I am the person who contacted you about this product. I would like to confirm the purchase." />
                    </div>

                    <div class="flex gap-4">
                        <h:commandButton value="Confirm Order"
                                         action="#{orderBean.confirmOrder}"
                                         styleClass="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 transition font-semibold" />

                        <a href="#{request.contextPath}/products/detail.xhtml"
                           class="bg-white border border-slate-300 text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition">
                            Cancel
                        </a>
                    </div>
                </h:form>
            </div>
        </section>
    </ui:define>

</ui:composition>
