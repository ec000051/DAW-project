<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{authBean.requireAdmin}" />
    </f:metadata>

    <ui:define name="title">Manage Products</ui:define>

    <ui:define name="content">

        <section class="max-w-6xl mx-auto">

            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">
                    Administration
                </p>

                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">
                    Manage Products
                </h1>

                <p class="text-slate-600">
                    Review, monitor, and remove marketplace products.
                </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">
                        Products Panel
                    </h2>

                    <p class="text-slate-500 text-sm mt-1">
                        List of all products currently stored in the marketplace.
                    </p>
                </div>

                <p id="emptyProductsMessage" class="text-slate-600 hidden">
                    No products are currently available in the marketplace.
                </p>

                <div id="productsTableWrapper" class="overflow-x-auto">

                    <table class="w-full border-collapse text-left">

                        <thead>

                        <tr>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    ID
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Image
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Product
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Seller
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Category
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Price
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Status
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Actions
                                </span>
                            </th>

                        </tr>

                        </thead>

                        <tbody id="productsTableBody">

                        </tbody>

                    </table>

                </div>

            </div>

        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";

            const productsTableBody =
                document.getElementById("productsTableBody");

            const productsTableWrapper =
                document.getElementById("productsTableWrapper");

            const emptyProductsMessage =
                document.getElementById("emptyProductsMessage");

            function escapeHtml(value) {

                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function renderProductImage(product) {

                if (product.imageUrl &&
                    product.imageUrl.trim() !== "") {

                    return '<img src="' +
                        escapeHtml(product.imageUrl) +
                        '" class="w-full h-full object-cover" />';
                }

                return '<div class="text-xs text-slate-400 text-center px-2">' +
                    'No image' +
                    '</div>';
            }

            function renderProducts(products) {

                if (!products || products.length === 0) {

                    productsTableWrapper.classList.add("hidden");

                    emptyProductsMessage.classList.remove("hidden");

                    return;
                }

                productsTableWrapper.classList.remove("hidden");

                emptyProductsMessage.classList.add("hidden");

                productsTableBody.innerHTML =
                    products.map(function(product) {

                        return '<tr>' +

                            '<td>' +
                            '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                            escapeHtml(product.id) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<div class="border-b border-slate-100 px-4 py-3">' +
                            '<div class="w-16 h-16 rounded-xl bg-slate-100 border border-slate-200 overflow-hidden flex items-center justify-center">' +
                            renderProductImage(product) +
                            '</div>' +
                            '</div>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block border-b border-slate-100 px-4 py-3 font-semibold text-slate-900">' +
                            escapeHtml(product.name) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                            escapeHtml(product.ownerUsername) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                            escapeHtml(product.category) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                            '€' + escapeHtml(product.price) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<span class="inline-block my-3 mx-4 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">' +
                            escapeHtml(product.status) +
                            '</span>' +
                            '</td>' +

                            '<td>' +
                            '<div class="border-b border-slate-100 px-4 py-3">' +
                            '<button type="button" onclick="deleteProduct(' + product.id + ')" ' +
                            'class="px-4 py-2 rounded-lg bg-red-50 text-red-700 hover:bg-red-100 transition text-sm font-semibold">' +
                            'Delete' +
                            '</button>' +
                            '</div>' +
                            '</td>' +

                            '</tr>';

                    }).join("");
            }

            async function loadProducts() {

                try {

                    const response = await fetch(
                        contextPath + "/api/admin/products"
                    );

                    if (response.status === 401 ||
                        response.status === 403) {

                        window.location.href =
                            contextPath + "/index.xhtml";

                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not load products");
                    }

                    const products = await response.json();

                    renderProducts(products);

                } catch (error) {

                    console.error(error);

                    productsTableWrapper.classList.add("hidden");

                    emptyProductsMessage.classList.remove("hidden");

                    emptyProductsMessage.textContent =
                        "Error loading products.";
                }
            }

            async function deleteProduct(id) {

                if (!confirm(
                    "Are you sure you want to delete this product?"
                )) {
                    return;
                }

                try {

                    const response = await fetch(
                        contextPath + "/api/admin/products/" + id,
                        {
                            method: "DELETE"
                        }
                    );

                    if (response.status === 401 ||
                        response.status === 403) {

                        window.location.href =
                            contextPath + "/index.xhtml";

                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not delete product");
                    }

                    await loadProducts();

                } catch (error) {

                    console.error(error);

                    alert("Error deleting product.");
                }
            }

            loadProducts();

            //]]>

        </script>

    </ui:define>

</ui:composition>
