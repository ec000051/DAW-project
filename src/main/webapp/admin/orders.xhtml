<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{authBean.requireAdmin}" />
    </f:metadata>

    <ui:define name="title">Manage Orders</ui:define>

    <ui:define name="content">

        <section class="max-w-6xl mx-auto">

            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">
                    Administration
                </p>

                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">
                    Manage Orders
                </h1>

                <p class="text-slate-600">
                    Review purchase requests and marketplace order activity.
                </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">
                        Orders Panel
                    </h2>

                    <p class="text-slate-500 text-sm mt-1">
                        List of all orders created in the marketplace.
                    </p>
                </div>

                <p id="emptyOrdersMessage" class="text-slate-600 hidden">
                    No orders are currently available in the marketplace.
                </p>

                <div id="ordersTableWrapper" class="overflow-x-auto">
                    <table class="w-full border-collapse text-left">
                        <thead>
                        <tr>
                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    ID
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Product
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Buyer
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Seller
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Message
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Status
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Actions
                                </span>
                            </th>
                        </tr>
                        </thead>

                        <tbody id="ordersTableBody">
                        </tbody>
                    </table>
                </div>

            </div>

        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";
            const ordersTableBody = document.getElementById("ordersTableBody");
            const ordersTableWrapper = document.getElementById("ordersTableWrapper");
            const emptyOrdersMessage = document.getElementById("emptyOrdersMessage");

            function escapeHtml(value) {
                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function renderOrders(orders) {
                if (!orders || orders.length === 0) {
                    ordersTableWrapper.classList.add("hidden");
                    emptyOrdersMessage.classList.remove("hidden");
                    return;
                }

                ordersTableWrapper.classList.remove("hidden");
                emptyOrdersMessage.classList.add("hidden");

                ordersTableBody.innerHTML = orders.map(function (order) {
                    return '<tr>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                        escapeHtml(order.id) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 font-semibold text-slate-900">' +
                        escapeHtml(order.productName) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                        escapeHtml(order.buyerUsername) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                        escapeHtml(order.sellerUsername) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                        escapeHtml(order.contactMessage) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="inline-block my-3 mx-4 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">' +
                        escapeHtml(order.status) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<div class="border-b border-slate-100 px-4 py-3">' +
                        '<button type="button" onclick="deleteOrder(' + order.id + ')" ' +
                        'class="px-4 py-2 rounded-lg bg-red-50 text-red-700 hover:bg-red-100 transition text-sm font-semibold">' +
                        'Delete' +
                        '</button>' +
                        '</div>' +
                        '</td>' +

                        '</tr>';
                }).join("");
            }

            async function loadOrders() {
                try {
                    const response = await fetch(contextPath + "/api/admin/orders");

                    if (response.status === 401 || response.status === 403) {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not load orders");
                    }

                    const orders = await response.json();
                    renderOrders(orders);

                } catch (error) {
                    console.error(error);
                    ordersTableWrapper.classList.add("hidden");
                    emptyOrdersMessage.classList.remove("hidden");
                    emptyOrdersMessage.textContent = "Error loading orders.";
                }
            }

            async function deleteOrder(id) {
                if (!confirm("Are you sure you want to delete this order?")) {
                    return;
                }

                try {
                    const response = await fetch(contextPath + "/api/admin/orders/" + id, {
                        method: "DELETE"
                    });

                    if (response.status === 401 || response.status === 403) {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not delete order");
                    }

                    await loadOrders();

                } catch (error) {
                    console.error(error);
                    alert("Error deleting order.");
                }
            }

            loadOrders();

            //]]>

        </script>

    </ui:define>

</ui:composition>
