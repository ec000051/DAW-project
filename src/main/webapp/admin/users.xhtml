<ui:composition template="/templates/main.xhtml"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core">

    <f:metadata>
        <f:viewAction action="#{authBean.requireAdmin}" />
    </f:metadata>

    <ui:define name="title">Manage Users</ui:define>

    <ui:define name="content">

        <section class="max-w-6xl mx-auto">

            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">
                    Administration
                </p>

                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">
                    Manage Users
                </h1>

                <p class="text-slate-600">
                    View registered users, their roles, and their contact information.
                </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl shadow-sm p-8">

                <div class="mb-6">
                    <h2 class="text-2xl font-bold text-slate-900">
                        Users Panel
                    </h2>

                    <p class="text-slate-500 text-sm mt-1">
                        List of all registered users in the system.
                    </p>
                </div>

                <p id="emptyUsersMessage" class="text-slate-600 hidden">
                    No users are currently available.
                </p>

                <div id="usersTableWrapper" class="overflow-x-auto">

                    <table class="w-full border-collapse text-left">
                        <thead>
                        <tr>
                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    ID
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    User
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Bio / Contact
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Role
                                </span>
                            </th>

                            <th>
                                <span class="block border-b border-slate-200 px-4 py-3 text-sm font-semibold text-slate-600">
                                    Actions
                                </span>
                            </th>
                        </tr>
                        </thead>

                        <tbody id="usersTableBody">
                        </tbody>
                    </table>

                </div>

            </div>

        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";

            const usersTableBody = document.getElementById("usersTableBody");
            const usersTableWrapper = document.getElementById("usersTableWrapper");
            const emptyUsersMessage = document.getElementById("emptyUsersMessage");

            function escapeHtml(value) {
                if (value === null || value === undefined) {
                    return "";
                }

                return String(value)
                    .replaceAll("&", "&amp;")
                    .replaceAll("<", "&lt;")
                    .replaceAll(">", "&gt;")
                    .replaceAll('"', "&quot;")
                    .replaceAll("'", "&#039;");
            }

            function renderUsers(users) {
                if (!users || users.length === 0) {
                    usersTableWrapper.classList.add("hidden");
                    emptyUsersMessage.classList.remove("hidden");
                    return;
                }

                usersTableWrapper.classList.remove("hidden");
                emptyUsersMessage.classList.add("hidden");

                usersTableBody.innerHTML = users.map(function (user) {
                    const bioText =
                        user.bio && user.bio.trim() !== ""
                            ? user.bio
                            : "No contact information added.";

                    const deleteButton =
                        user.role === "USER"
                            ? '<button type="button" onclick="deleteUser(' + user.id + ')" ' +
                            'class="px-4 py-2 rounded-lg bg-red-600 text-white hover:bg-red-700 transition text-sm font-semibold">' +
                            'Delete User' +
                            '</button>'
                            : "";

                    return '<tr>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700">' +
                        escapeHtml(user.id) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<div class="border-b border-slate-100 px-4 py-3">' +
                        '<p class="font-semibold text-slate-900">' +
                        escapeHtml(user.username) +
                        '</p>' +
                        '<p class="text-sm text-slate-500">' +
                        escapeHtml(user.email) +
                        '</p>' +
                        '</div>' +
                        '</td>' +

                        '<td>' +
                        '<span class="block border-b border-slate-100 px-4 py-3 text-slate-700 max-w-xs">' +
                        escapeHtml(bioText) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<span class="inline-block my-3 mx-4 rounded-full bg-slate-100 px-3 py-1 text-xs font-semibold text-slate-700">' +
                        escapeHtml(user.role) +
                        '</span>' +
                        '</td>' +

                        '<td>' +
                        '<div class="border-b border-slate-100 px-4 py-3">' +
                        deleteButton +
                        '</div>' +
                        '</td>' +

                        '</tr>';
                }).join("");
            }

            async function loadUsers() {
                try {
                    const response = await fetch(contextPath + "/api/admin/users");

                    if (response.status === 401 || response.status === 403) {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not load users");
                    }

                    const users = await response.json();
                    renderUsers(users);

                } catch (error) {
                    console.error(error);
                    usersTableWrapper.classList.add("hidden");
                    emptyUsersMessage.classList.remove("hidden");
                    emptyUsersMessage.textContent = "Error loading users.";
                }
            }

            async function deleteUser(id) {
                if (!confirm("Delete this user account, including their products and orders?")) {
                    return;
                }

                try {
                    const response = await fetch(contextPath + "/api/admin/users/" + id, {
                        method: "DELETE"
                    });

                    if (response.status === 401 || response.status === 403) {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not delete user");
                    }

                    await loadUsers();

                } catch (error) {
                    console.error(error);
                    alert("Error deleting user.");
                }
            }

            loadUsers();

            //]]>

        </script>

    </ui:define>
</ui:composition>
