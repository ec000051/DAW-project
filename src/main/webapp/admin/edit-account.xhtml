<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{authBean.requireAdmin}" />
    </f:metadata>

    <ui:define name="title">Edit Admin Account</ui:define>

    <ui:define name="content">

        <div class="flex items-center gap-3 mb-8">

            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>

        </div>

        <section class="max-w-2xl mx-auto">

            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">
                    Administration
                </p>

                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">
                    Edit Admin Account
                </h1>

                <p class="text-slate-600">
                    Update your administrator account information.
                </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-8">

                <form id="editAdminAccountForm" class="space-y-5">

                    <div id="messageBox" class="hidden rounded-xl px-4 py-3 text-sm font-semibold"></div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Username
                        </label>

                        <input id="usernameInput"
                               type="text"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Email
                        </label>

                        <input id="emailInput"
                               type="text"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Password
                        </label>

                        <input id="passwordInput"
                               type="password"
                               placeholder="Leave empty if you do not want to change it"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div class="flex gap-3 pt-2">

                        <button type="submit"
                                class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 transition font-semibold">
                            Save Changes
                        </button>

                        <a href="#{request.contextPath}/admin/account.xhtml"
                           class="bg-white border border-slate-300 text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition">
                            Cancel
                        </a>

                    </div>

                </form>

            </div>

        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";

            const editAdminAccountForm = document.getElementById("editAdminAccountForm");
            const usernameInput = document.getElementById("usernameInput");
            const emailInput = document.getElementById("emailInput");
            const passwordInput = document.getElementById("passwordInput");
            const messageBox = document.getElementById("messageBox");

            let currentAdmin = null;

            function showMessage(message, type) {
                messageBox.textContent = message;
                messageBox.classList.remove("hidden");

                if (type === "success") {
                    messageBox.className =
                        "rounded-xl px-4 py-3 text-sm font-semibold bg-green-100 text-green-700";
                } else {
                    messageBox.className =
                        "rounded-xl px-4 py-3 text-sm font-semibold bg-red-100 text-red-700";
                }
            }

            async function loadAdminAccountForEdit() {
                try {
                    const response = await fetch(contextPath + "/api/users/me");

                    if (response.status === 401) {
                        window.location.href = contextPath + "/login.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not load admin account");
                    }

                    const user = await response.json();

                    if (user.role !== "ADMIN") {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    currentAdmin = user;

                    usernameInput.value = user.username || "";
                    emailInput.value = user.email || "";

                } catch (error) {
                    console.error(error);
                    showMessage("Error loading admin account information.", "error");
                }
            }

            editAdminAccountForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                const updatedAdmin = {
                    username: usernameInput.value.trim(),
                    email: emailInput.value.trim(),
                    bio: currentAdmin && currentAdmin.bio ? currentAdmin.bio : "",
                    profileImage: currentAdmin && currentAdmin.profileImage ? currentAdmin.profileImage : "",
                    password: passwordInput.value.trim()
                };

                try {
                    const response = await fetch(contextPath + "/api/users/me", {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedAdmin)
                    });

                    if (response.status === 401) {
                        window.location.href = contextPath + "/login.xhtml";
                        return;
                    }

                    if (response.status === 403) {
                        window.location.href = contextPath + "/index.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not update admin account");
                    }

                    showMessage("Admin account updated successfully.", "success");

                    setTimeout(function () {
                        window.location.href = contextPath + "/admin/account.xhtml";
                    }, 700);

                } catch (error) {
                    console.error(error);
                    showMessage("Error saving admin account changes.", "error");
                }
            });

            loadAdminAccountForEdit();

            //]]>

        </script>

    </ui:define>

</ui:composition>
