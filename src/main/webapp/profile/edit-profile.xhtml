<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <f:metadata>
        <f:viewAction action="#{authBean.requireUser}" />
    </f:metadata>

    <ui:define name="title">Edit Profile</ui:define>

    <ui:define name="content">
        <div class="flex items-center gap-3 mb-8">

            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>

        </div>

        <section class="max-w-2xl mx-auto">
            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">Account</p>
                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">Edit Profile</h1>
                <p class="text-slate-600">Update your public profile and contact information.</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-8">

                <form id="editProfileForm" class="space-y-5">

                    <div id="messageBox" class="hidden rounded-xl px-4 py-3 text-sm font-semibold"></div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Username</label>
                        <input id="usernameInput"
                               type="text"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Email / Contact</label>
                        <input id="emailInput"
                               type="text"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Profile Image URL</label>
                        <input id="profileImageInput"
                               type="text"
                               placeholder="https://example.com/profile.jpg"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Bio / Contact Info</label>
                        <textarea id="bioInput"
                                  rows="5"
                                  placeholder="Example: Contact me by WhatsApp or email. I usually respond in the afternoon."
                                  class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">New Password</label>
                        <input id="passwordInput"
                               type="password"
                               placeholder="Leave empty if you do not want to change it"
                               class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div class="flex gap-3 pt-2">
                        <button type="submit"
                                class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 transition font-semibold">
                            Save Changes
                        </button>

                        <a href="#{request.contextPath}/profile/profile.xhtml"
                           class="bg-white border border-slate-300 text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition">
                            Cancel
                        </a>
                    </div>

                    <div class="border-t border-slate-200 pt-6 mt-6">

                        <button type="button"
                                onclick="document.getElementById('deleteAccountModal').classList.remove('hidden')"
                                class="bg-red-600 text-white px-6 py-3 rounded-xl hover:bg-red-700 transition font-semibold">
                            Delete My Account
                        </button>

                        <div id="deleteAccountModal"
                             class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/50 px-4">

                            <div class="bg-white rounded-3xl shadow-xl max-w-md w-full p-8">
                                <h2 class="text-2xl font-extrabold text-slate-900 mb-3">
                                    Delete account?
                                </h2>

                                <p class="text-slate-600 mb-6">
                                    This will permanently delete your account, your products, and your related orders. This action cannot be undone.
                                </p>

                                <div class="flex justify-end gap-3">
                                    <button type="button"
                                            onclick="document.getElementById('deleteAccountModal').classList.add('hidden')"
                                            class="bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                                        Cancel
                                    </button>

                                    <button type="button"
                                            onclick="showMessage('Delete account is still using the old JSF action. We can convert it after adding DELETE /api/users/me.', 'error')"
                                            class="bg-red-600 text-white px-5 py-3 rounded-xl hover:bg-red-700 transition font-semibold">
                                        Yes, Delete Account
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                </form>
            </div>
        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";

            const editProfileForm = document.getElementById("editProfileForm");
            const usernameInput = document.getElementById("usernameInput");
            const emailInput = document.getElementById("emailInput");
            const profileImageInput = document.getElementById("profileImageInput");
            const bioInput = document.getElementById("bioInput");
            const passwordInput = document.getElementById("passwordInput");
            const messageBox = document.getElementById("messageBox");

            function showMessage(message, type) {
                messageBox.textContent = message;
                messageBox.classList.remove("hidden");

                if (type === "success") {
                    messageBox.className = "rounded-xl px-4 py-3 text-sm font-semibold bg-green-100 text-green-700";
                } else {
                    messageBox.className = "rounded-xl px-4 py-3 text-sm font-semibold bg-red-100 text-red-700";
                }
            }

            async function loadMyProfileForEdit() {
                try {
                    const response = await fetch(contextPath + "/api/users/me");

                    if (response.status === 401) {
                        window.location.href = contextPath + "/login.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not load profile");
                    }

                    const user = await response.json();

                    usernameInput.value = user.username || "";
                    emailInput.value = user.email || "";
                    profileImageInput.value = user.profileImage || "";
                    bioInput.value = user.bio || "";

                } catch (error) {
                    console.error(error);
                    showMessage("Error loading profile information.", "error");
                }
            }

            editProfileForm.addEventListener("submit", async function (event) {
                event.preventDefault();

                const updatedUser = {
                    username: usernameInput.value.trim(),
                    email: emailInput.value.trim(),
                    profileImage: profileImageInput.value.trim(),
                    bio: bioInput.value.trim(),
                    password: passwordInput.value.trim()
                };

                try {
                    const response = await fetch(contextPath + "/api/users/me", {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(updatedUser)
                    });

                    if (response.status === 401) {
                        window.location.href = contextPath + "/login.xhtml";
                        return;
                    }

                    if (!response.ok) {
                        throw new Error("Could not update profile");
                    }

                    showMessage("Profile updated successfully.", "success");

                    setTimeout(function () {
                        window.location.href = contextPath + "/profile/profile.xhtml";
                    }, 700);

                } catch (error) {
                    console.error(error);
                    showMessage("Error saving profile changes.", "error");
                }
            });

            loadMyProfileForEdit();

            //]]>
        </script>

    </ui:define>

</ui:composition>
