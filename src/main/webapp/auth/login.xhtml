<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:pt="jakarta.faces.passthrough"
                template="/templates/main.xhtml">

    <ui:define name="title">Login</ui:define>

    <ui:define name="content">
        <section class="flex items-center justify-center min-h-[70vh]">
            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm w-full max-w-md p-8">

                <div class="mb-6 text-center">
                    <h1 class="text-3xl font-extrabold text-slate-900 mb-2">
                        Welcome back
                    </h1>
                    <p class="text-slate-500">
                        Log in to your account to continue
                    </p>
                </div>

                <h:form>

                    <h:messages globalOnly="true"
                                styleClass="text-red-500 text-sm mb-4 block" />

                    <div class="mb-4">
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Username
                        </label>

                        <h:inputText id="username"
                                     value="#{authBean.username}"
                                     required="true"
                                     requiredMessage="Username is required."
                                     styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900"
                                     pt:placeholder="Enter your username" />

                        <h:message for="username"
                                   styleClass="text-red-500 text-sm mt-2 block" />
                    </div>

                    <div class="mb-6">
                        <label class="block text-sm font-medium text-slate-700 mb-2">
                            Password
                        </label>

                        <h:inputSecret id="password"
                                       value="#{authBean.password}"
                                       required="true"
                                       requiredMessage="Password is required."
                                       styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900"
                                       pt:placeholder="Enter your password" />

                        <h:message for="password"
                                   styleClass="text-red-500 text-sm mt-2 block" />
                    </div>

                    <h:commandButton value="Login"
                                     action="#{authBean.login}"
                                     styleClass="w-full bg-slate-900 text-white py-3 rounded-xl hover:bg-slate-800 transition font-semibold" />

                </h:form>

                <!-- Footer -->
                <div class="mt-6 text-center text-sm text-slate-500">
                    Don't have an account?
                    <a href="#{request.contextPath}/auth/register.xhtml"
                       class="text-slate-900 font-semibold hover:underline">
                        Sign up
                    </a>
                </div>

            </div>
        </section>
    </ui:define>

</ui:composition>
