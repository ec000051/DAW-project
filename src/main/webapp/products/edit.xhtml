<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <ui:define name="title">Edit Product</ui:define>

    <ui:define name="content">

        <div class="flex items-center gap-3 mb-8">
            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>
        </div>

        <section class="max-w-4xl mx-auto space-y-6">
            <div>
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">Seller Panel</p>
                <h1 class="text-4xl font-extrabold text-slate-900">Edit Listing</h1>
                <p class="text-slate-600 mt-2">Update the product information for your marketplace listing.</p>
            </div>

            <div class="bg-white rounded-3xl border border-slate-200 shadow-sm p-8">

                <form id="editProductForm" class="space-y-6">

                    <div id="formMessage" class="hidden text-red-500 text-sm mb-2"></div>

                    <div class="grid md:grid-cols-2 gap-6">

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Product name</label>

                            <input type="text"
                                   id="name"
                                   class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Price</label>

                            <input type="number"
                                   step="0.01"
                                   id="price"
                                   class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                        </div>

                        <div>
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Status</label>

                            <select id="status"
                                    class="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">

                                <option value="AVAILABLE">Available</option>
                                <option value="UNAVAILABLE">Unavailable</option>
                                <option value="RESERVED">Reserved</option>
                                <option value="SOLD">Sold</option>

                            </select>
                        </div>

                        <div>
                            <label class="block text-sm font-medium text-slate-700 mb-2">Category</label>

                            <select id="category"
                                    class="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">

                                <option value="Electronics">Electronics</option>
                                <option value="Furniture">Furniture</option>
                                <option value="Books">Books</option>
                                <option value="Accessories">Accessories</option>
                                <option value="Other">Other</option>

                            </select>
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Image URL</label>

                            <input type="text"
                                   id="imageUrl"
                                   class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                        </div>

                        <div class="md:col-span-2">
                            <label class="block text-sm font-semibold text-slate-700 mb-2">Description</label>

                            <textarea id="description"
                                      rows="5"
                                      class="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900"></textarea>
                        </div>

                    </div>

                    <div class="flex flex-wrap gap-3 pt-2">
                        <button type="submit"
                                class="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 cursor-pointer transition font-semibold">
                            Update Product
                        </button>

                        <a href="#{request.contextPath}/products/list.xhtml"
                           class="inline-block bg-white border border-slate-300 text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition">
                            Cancel
                        </a>
                    </div>

                </form>

            </div>
        </section>

        <script type="text/javascript">
            //<![CDATA[

            const contextPath = "#{request.contextPath}";
            const params = new URLSearchParams(window.location.search);
            const productId = params.get("id");

            const form = document.getElementById("editProductForm");
            const formMessage = document.getElementById("formMessage");

            const nameInput = document.getElementById("name");
            const priceInput = document.getElementById("price");
            const statusInput = document.getElementById("status");
            const categoryInput = document.getElementById("category");
            const imageUrlInput = document.getElementById("imageUrl");
            const descriptionInput = document.getElementById("description");

            function showMessage(message) {
                formMessage.textContent = message;
                formMessage.classList.remove("hidden");
            }

            function validateEditProductForm() {
                if (nameInput.value.trim().length < 3) {
                    alert("Product name must contain at least 3 characters.");
                    nameInput.focus();
                    return false;
                }

                if (priceInput.value === "" || isNaN(priceInput.value)) {
                    alert("Price must be a valid number.");
                    priceInput.focus();
                    return false;
                }

                if (Number(priceInput.value) <= 0) {
                    alert("Price must be greater than 0.");
                    priceInput.focus();
                    return false;
                }

                if (imageUrlInput.value.trim() !== "" &&
                    !imageUrlInput.value.startsWith("http")) {

                    alert("Image URL must start with http or https.");
                    imageUrlInput.focus();
                    return false;
                }

                if (descriptionInput.value.trim().length < 10) {
                    alert("Description must contain at least 10 characters.");
                    descriptionInput.focus();
                    return false;
                }

                return true;
            }

            async function loadProduct() {
                if (!productId) {
                    showMessage("No product ID was provided.");
                    return;
                }

                try {
                    const response = await fetch(contextPath + "/api/products/" + productId);

                    if (!response.ok) {
                        throw new Error("Could not load product");
                    }

                    const product = await response.json();

                    nameInput.value = product.name || "";
                    priceInput.value = product.price || "";
                    statusInput.value = product.status || "AVAILABLE";
                    categoryInput.value = product.category || "Other";
                    imageUrlInput.value = product.imageUrl || "";
                    descriptionInput.value = product.description || "";

                } catch (error) {
                    console.error(error);
                    showMessage("Error loading product.");
                }
            }

            form.addEventListener("submit", async function (event) {
                event.preventDefault();

                if (!validateEditProductForm()) {
                    return;
                }

                const productData = {
                    id: Number(productId),
                    name: nameInput.value,
                    price: Number(priceInput.value),
                    status: statusInput.value,
                    category: categoryInput.value,
                    imageUrl: imageUrlInput.value,
                    description: descriptionInput.value
                };

                try {
                    const response = await fetch(contextPath + "/api/products/" + productId, {
                        method: "PUT",
                        headers: {
                            "Content-Type": "application/json"
                        },
                        body: JSON.stringify(productData)
                    });

                    if (!response.ok) {
                        throw new Error("Could not update product");
                    }

                    window.location.href = contextPath + "/products/list.xhtml";

                } catch (error) {
                    console.error(error);
                    alert("Error updating product.");
                }
            });

            loadProduct();

            //]]>
        </script>

    </ui:define>

</ui:composition>
