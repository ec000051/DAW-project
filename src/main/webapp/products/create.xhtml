<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                xmlns:h="jakarta.faces.html"
                xmlns:f="jakarta.faces.core"
                template="/templates/main.xhtml">

    <ui:define name="title">Create Product</ui:define>



    <ui:define name="content">

        <div class="flex items-center gap-3 mb-8">

            <button type="button"
                    onclick="history.back()"
                    class="inline-flex items-center gap-2 bg-white border border-slate-300 text-slate-800 px-5 py-3 rounded-xl hover:bg-slate-100 transition">
                ← Back
            </button>

        </div>

        <section class="max-w-3xl mx-auto">
            <div class="mb-8">
                <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">Seller Panel</p>
                <h1 class="text-4xl font-extrabold text-slate-900 mb-3">Create Product</h1>
                <p class="text-slate-600">Add a new product to your marketplace listings.</p>
            </div>

            <div class="bg-white border border-slate-200 rounded-3xl shadow-sm p-8">
                <h:form styleClass="space-y-5">

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Name</label>
                        <h:inputText value="#{productBean.product.name}"
                                     required="true"
                                     requiredMessage="Name is required"
                                     styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Price</label>
                        <h:inputText id="price"
                                     value="#{productBean.product.price}"
                                     required="true"
                                     requiredMessage="Price is required."
                                     converterMessage="Price must be a valid number."
                                     styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <f:validateDoubleRange minimum="0.01" minimumMessage="Price must be greater than 0." />
                        </h:inputText>
                        <h:message for="price" styleClass="text-red-500 text-sm mt-2 block" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Image URL</label>
                        <h:inputText value="#{productBean.product.imageUrl}"
                                     styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Status</label>
                        <h:selectOneMenu value="#{productBean.product.status}"
                                         styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <f:selectItem itemValue="AVAILABLE" itemLabel="Available" />
                            <f:selectItem itemValue="UNAVAILABLE" itemLabel="Unavailable" />
                        </h:selectOneMenu>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Category</label>
                        <h:selectOneMenu value="#{productBean.product.category}"
                                         styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 bg-white focus:outline-none focus:ring-2 focus:ring-slate-900">
                            <f:selectItem itemValue="Electronics" itemLabel="Electronics" />
                            <f:selectItem itemValue="Furniture" itemLabel="Furniture" />
                            <f:selectItem itemValue="Books" itemLabel="Books" />
                            <f:selectItem itemValue="Accessories" itemLabel="Accessories" />
                            <f:selectItem itemValue="Other" itemLabel="Other" />
                        </h:selectOneMenu>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-2">Description</label>
                        <h:inputTextarea value="#{productBean.product.description}"
                                         rows="5"
                                         styleClass="w-full border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />
                    </div>

                    <div class="flex gap-3 pt-2">
                        <h:commandButton value="Save Product"
                                         action="#{productBean.create}"
                                         styleClass="bg-slate-900 text-white px-6 py-3 rounded-xl hover:bg-slate-800 cursor-pointer transition font-semibold" />

                        <h:link value="Back to List"
                                outcome="/products/list.xhtml"
                                styleClass="inline-block bg-white border border-slate-300 text-slate-800 px-6 py-3 rounded-xl hover:bg-slate-100 transition" />
                    </div>

                </h:form>
            </div>
        </section>
    </ui:define>

</ui:composition>
