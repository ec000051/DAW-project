<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ui="jakarta.faces.facelets"
                template="/templates/main.xhtml">

    <ui:define name="title">Browse Products</ui:define>

    <ui:define name="content">

        <section class="mb-8">
            <p class="text-sm uppercase tracking-widest text-slate-500 font-semibold">Marketplace</p>
            <h1 class="text-4xl font-extrabold text-slate-900 mb-3">Browse Products</h1>
            <p class="text-slate-600">Explore all products available from students.</p>
        </section>

        <section class="bg-white border border-slate-200 rounded-2xl p-5 mb-8">
            <div class="grid md:grid-cols-5 gap-4">
                <input id="searchKeyword"
                       placeholder="Search products..."
                       class="md:col-span-2 border border-slate-300 rounded-xl px-4 py-3 focus:outline-none focus:ring-2 focus:ring-slate-900" />

                <select id="selectedCategory"
                        class="border border-slate-300 rounded-xl px-4 py-3 bg-white">
                    <option value="ALL">All categories</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Furniture">Furniture</option>
                    <option value="Books">Books</option>
                    <option value="Accessories">Accessories</option>
                    <option value="Other">Other</option>
                </select>

                <button type="button"
                        onclick="filterProducts()"
                        class="bg-slate-900 text-white rounded-xl px-4 py-3 hover:bg-slate-800">
                    Search
                </button>

                <button type="button"
                        onclick="clearFilters()"
                        class="bg-white border border-slate-300 text-slate-800 rounded-xl px-4 py-3 hover:bg-slate-100">
                    Clear
                </button>


            </div>
        </section>

        <div id="message" class="mb-6 font-semibold"></div>

        <section id="productsGrid" class="grid md:grid-cols-4 gap-6">
        </section>

        <div id="emptyState" class="hidden bg-white border border-slate-200 rounded-3xl shadow-sm p-12 text-center mb-8">
            <h2 class="text-2xl font-extrabold text-slate-900 mb-3">
                No products found
            </h2>

            <p class="text-slate-500 max-w-md mx-auto">
                We could not find any products matching your search or selected category.
                Try changing the filters or searching for something else.
            </p>
        </div>

        <script>
            /* <![CDATA[ */

            const apiUrl = "/daw-project/api/products";
            let allProducts = [];

            document.addEventListener("DOMContentLoaded", loadProducts);

            async function loadProducts() {
                try {
                    const response = await fetch(apiUrl);

                    if (!response.ok) {
                        throw new Error("Could not load products");
                    }

                    allProducts = await response.json();
                    renderProducts(allProducts);
                } catch (error) {
                    showMessage("Error loading products from REST API.", "red");
                    console.error(error);
                }
            }

            function renderProducts(products) {
                const grid = document.getElementById("productsGrid");
                const emptyState = document.getElementById("emptyState");

                grid.innerHTML = "";

                if (!products || products.length === 0) {
                    emptyState.classList.remove("hidden");
                    return;
                }

                emptyState.classList.add("hidden");

                products.forEach(product => {
                    const imageHtml = product.imageUrl
                        ? `<img src="\${escapeHtml(product.imageUrl)}" class="w-full h-full object-cover" />`
                        : `<div class="h-full flex items-center justify-center text-slate-500">No Image</div>`;

                    const card = document.createElement("div");
                    card.className = "bg-white border border-slate-200 rounded-2xl overflow-hidden shadow-sm hover:shadow-md transition";

                    card.innerHTML = `
                        <div class="h-44 bg-slate-200 overflow-hidden">
                            \${imageHtml}
                        </div>

                        <div class="p-5">
                            <h3 class="font-bold text-lg">\${escapeHtml(product.name || "")}</h3>
                            <p class="text-slate-500 text-sm mb-3">\${escapeHtml(product.description || "")}</p>
                            <p class="font-extrabold text-slate-900">€\${product.price || 0}</p>

                            <span class="inline-block mt-3 px-3 py-1 rounded-full text-xs font-semibold bg-slate-100 text-slate-700">
                                \${escapeHtml(product.status || "AVAILABLE")}
                            </span>

                            <div class="flex gap-2 mt-4">
                                <a href="detail.xhtml?id=\${product.id}"
                                   class="px-3 py-2 rounded-lg bg-slate-900 text-white text-sm hover:bg-slate-800">
                                    Details
                                </a>
                            </div>

                        </div>
                    `;

                    grid.appendChild(card);
                });
            }

            function filterProducts() {
                const keyword = document.getElementById("searchKeyword").value.toLowerCase().trim();
                const category = document.getElementById("selectedCategory").value;

                const filtered = allProducts.filter(product => {
                    const matchesKeyword =
                        !keyword ||
                        (product.name && product.name.toLowerCase().includes(keyword)) ||
                        (product.description && product.description.toLowerCase().includes(keyword));

                    const matchesCategory =
                        category === "ALL" || product.category === category;

                    return matchesKeyword && matchesCategory;
                });

                renderProducts(filtered);
            }

            function clearFilters() {
                document.getElementById("searchKeyword").value = "";
                document.getElementById("selectedCategory").value = "ALL";
                renderProducts(allProducts);
            }

            function showMessage(text, color) {
                const message = document.getElementById("message");
                message.textContent = text;
                message.className = color === "green"
                    ? "mb-6 font-semibold text-green-600"
                    : "mb-6 font-semibold text-red-600";
            }

            function escapeHtml(value) {
                return String(value)
                    .replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
            }

            /* ]]> */
        </script>

    </ui:define>
</ui:composition>
